#region Gradle Config Properties
# https://docs.gradle.org/current/userguide/build_environment.html#gradle_properties_reference

org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
#endregion

#region Gradle General Properties

group=dev.codinglabs
version=1.0.0
description=Coding Lab Modpack Specific Tweaks
#endregion

#region Toolchain Properties

org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
#endregion

#region Application Properties

main_class=dev.codinglabs.updater.Installer
#endregion

#region Minecraft Properties
# Parchment version can be found at:
# https://parchmentmc.org/docs/getting-started

minecraft_version=1.21.1
parchment_version=2024.11.17
#endregion

#region Mod Common Properties
# SPDX License Identifiers for automation tool can be found at:
# https://spdx.org/licenses/

mod_id=modpack_updater
mod_name=Modpack Updater
mod_license=GPL-3.0-or-later
target_java_version=21
archive_base_name=ModpackUpdater
#endregion

#region NeoForge Properties
# Neoforge version can be found at:
# https://projects.neoforged.net/neoforged/neoforge

neoforge_version=21.1.259
minecraft_version_range=[1.21.1]
neoforge_version_range=[1,)
#endregion

#region Dependency Properties

jackson_databind_version=2.15.2
#endregion
